# MaaFwApp 打包配方：把本仓库 assets/ 作为 PI 资源打进 APK
# 相对路径相对本文件所在目录；进包白名单 = 默认项 + config + MaaCommonAssets
assets: ./assets

include:
  - interface.json
  - resource/**
  - config/** 
  - agent/**
  - docs/imgs/hz_logo.png
  - CONTACT
  - LICENSE

exclude: []
        
display: 
  foreground: false 
  presets:
    # label 可选，缺省为「短边P」
    - label: 720P
      width: 1280
      height: 720
      dpi: 240
    - width: 1920
      height: 1080
      dpi: 280
      
app: 
  id: mhz
  label: MHZ 
  icon: ./docs/imgs/hz_logo.png

